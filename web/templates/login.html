{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<div class="narrow" style="margin-top:8vh">
  <p><span class="logo">agenda</span></p>
  <h1>Entrar</h1>
  <p class="lead">Acesse sua agenda para ver os horários marcados e organizar a semana.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" value="{{ email }}" autocomplete="username" required>
    <label for="password">Senha</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <div class="actions"><button type="submit" class="block">Entrar</button></div>
  </form>
</div>
{% endblock %}
